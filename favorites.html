<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - EstateHub</title>

    <link rel="stylesheet" href="./css/style.css">

    <style>
        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .favorites-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .favorites-title {
            text-align: center;
            font-size: 35px;
            margin-bottom: 30px;
            color: #0f172a;
        }

        #favoritesList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .favorite-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,.1);
            transition: .3s;
        }

        .favorite-card:hover {
            transform: translateY(-8px);
        }

        .favorite-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .favorite-body {
            padding: 20px;
        }

        .favorite-body h3 {
            margin-bottom: 10px;
        }

        .favorite-body p {
            margin: 8px 0;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .buttons button {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .view-btn {
            background: #2563eb;
            color: white;
        }

        .remove-btn {
            background: crimson;
            color: white;
        }

        @media(max-width:768px){

            .favorites-title{
                font-size:28px;
            }

            .buttons{
                flex-direction:column;
                gap:10px;
            }

            .buttons button{
                width:100%;
            }

        }
        .logo-container {
    display: flex;
    justify-content: center;   /* Horizontal center */
    align-items: center;       /* Vertical center */
    height: vh;             /* Full viewport height */
}

.logo {
    width: 200px;              /* Adjust size as needed */
    height: auto;
}

    </style>

</head>

<body>

    <div class="favorites-container">

    <div class="logo-container">
    <img src="assets/img/ChatGPT Image Jul 9, 2026, 04_09_14 AM.png" alt="Logo" class="logo">
</div>

        <div id="favoritesList"></div>

    </div>
<script src="./js/favorites.js"></script>
<script src="./js/script.js"></script>

</body>

</html>
