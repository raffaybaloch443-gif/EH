<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstateHub - Profile</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/navbar.css">
  <style>
    .profile-page{min-height:calc(100vh - 72px);background:#f5f7fb;padding:40px 20px}
    .profile-card{width:min(720px,100%);margin:0 auto;background:#fff;border:1px solid #e1e6ef;border-radius:12px;padding:32px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
    .profile-head{text-align:center;margin-bottom:28px}
    .profile-avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #eef2f7;margin-bottom:14px}
    .profile-name{margin:0 0 6px;font-size:28px;color:#10213f}.profile-email{margin:0;color:#667085}
    .profile-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.profile-field{display:flex;flex-direction:column;gap:7px}.profile-field.full{grid-column:1/-1}
    .profile-field label{font-weight:600;color:#10213f}.profile-field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8dee9;border-radius:7px;font:inherit}
    @media(max-width:600px){.profile-page{padding:22px 14px}.profile-card{padding:22px 16px}.profile-fields{grid-template-columns:1fr}.profile-field.full{grid-column:auto}.profile-name{font-size:23px}}
  </style>
</head>
<body>
  <header class="topbar" data-global-header>
    <a class="brand" href="index.html"><span class="brand-icon">&#8962;</span>EstateHub</a>
    <nav class="nav"><a href="index.html">Home</a><a href="properties.html">Properties</a><a href="about.html">About Us</a><a href="messages.html">Contact</a><a href="favorites.html" id="favoriteLink">Favorites (0)</a></nav>
    <a class="btn dark hide-mobile" href="login.html" id="loginRegisterBtn">Login / Register</a>
  </header>
  <main class="profile-page">
    <section class="profile-card">
      <div class="profile-head">
        <img id="profileAvatar" class="profile-avatar" src="./assets/img/default-avatar.svg" alt="Profile picture">
        <h1 id="profileName" class="profile-name">My Profile</h1>
        <p id="profileEmail" class="profile-email">Your account information</p>
      </div>
      <div class="profile-fields">
        <div class="profile-field"><label for="profileNameInput">Name</label><input id="profileNameInput" type="text" readonly></div>
        <div class="profile-field"><label for="profileEmailInput">Email</label><input id="profileEmailInput" type="email" readonly></div>
      </div>
    </section>
  </main>
  <script src="./js/script.js"></script>
  <script>
    (function(){
      try {
        const raw=localStorage.getItem('estatehubUser')||localStorage.getItem('user');
        const user=raw?JSON.parse(raw):{};
        const name=user.name||user.fullName||user.username||'My Profile';
        const email=user.email||'';
        const avatar=user.avatar||user.profileImage||user.profilePicture||user.photo||user.image||user.dp||'';
        document.getElementById('profileName').textContent=name;
        document.getElementById('profileEmail').textContent=email||'Your account information';
        document.getElementById('profileNameInput').value=name;
        document.getElementById('profileEmailInput').value=email;
        if(avatar) document.getElementById('profileAvatar').src=avatar;
      } catch(e){}
    })();
  </script>
</body>
</html>
